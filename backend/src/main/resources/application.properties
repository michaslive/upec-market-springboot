spring.application.name=backend
server.port=${SERVER_PORT:8080}
# Para usar un túnel público (Cloudflare/trycloudflare) define la variable de entorno:
# CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,https://tu-frontend.trycloudflare.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
management.endpoints.web.exposure.include=health
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.directory=${UPLOAD_DIRECTORY:uploads}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:5242880}
app.storage.bucket=${SUPABASE_S3_BUCKET:product-images}
app.storage.endpoint=${SUPABASE_S3_ENDPOINT:}
app.storage.region=${SUPABASE_S3_REGION:us-east-1}
app.storage.access-key=${SUPABASE_S3_ACCESS_KEY_ID:}
app.storage.secret-key=${SUPABASE_S3_SECRET_ACCESS_KEY:}
app.storage.public-url=${SUPABASE_S3_PUBLIC_URL:}
app.storage.path-style=${AWS_USE_PATH_STYLE_ENDPOINT:true}
app.session.expiration-hours=${SESSION_EXPIRATION_HOURS:24}
app.reservation.duration-minutes=${RESERVATION_DURATION_MINUTES:10}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
app.super-admin.name=${SUPER_ADMIN_NAME:Administrador UPEC}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
