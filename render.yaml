services:
  - type: web
    name: upec-market-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_MAX_POOL_SIZE
        value: 3
      - key: DB_MIN_IDLE
        value: 1
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: product-images
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_PUBLIC_URL
        sync: false
